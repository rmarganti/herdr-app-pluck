[package]
name = "herdr-app-pluck"
version = "0.1.0"
edition = "2021"
description = "Keyboard hints over the focused Herdr app pane: copy a visible token or open a visible URL"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ghostty-vt = { version = "=0.8.0", default-features = false }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
unicode-width = "0.2.2"

[dev-dependencies]
png = "0.17"
pretty_assertions = "1.4"

[profile.release]
strip = true
